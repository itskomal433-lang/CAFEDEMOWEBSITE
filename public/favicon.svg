<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C3E2E"/>
      <stop offset="100%" stop-color="#18241A"/>
    </linearGradient>

    <!-- Mug Body Gradient -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF6EE"/>
      <stop offset="60%" stop-color="#F2ECE0"/>
      <stop offset="100%" stop-color="#E5D9C7"/>
    </linearGradient>

    <!-- Coffee Crema Gradient -->
    <radialGradient id="coffeeCrema" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9C5E3D"/>
      <stop offset="65%" stop-color="#5E3519"/>
      <stop offset="100%" stop-color="#3D200E"/>
    </radialGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D07A60" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8A38D" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A38D"/>
      <stop offset="100%" stop-color="#D07A60"/>
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.2" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#D07A60" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Rising Aromatic Steam Swirls -->
  <g filter="url(#subtleShadow)">
    <path d="M25 20C23.5 16 26.5 13 25.5 9" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M32 19C29.8 14 34.2 11.5 32 6.5" stroke="url(#steamGrad)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M39 20C37.5 16 40.5 13 39.5 9" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Saucer Base -->
  <ellipse cx="32" cy="52" rx="20" ry="3.5" fill="#E8DFD3" filter="url(#subtleShadow)"/>
  <ellipse cx="32" cy="51.5" rx="17" ry="2.2" fill="#FAF6EE"/>

  <!-- Mug Handle -->
  <path d="M38 29C46.5 29 48.5 42 38 45" fill="none" stroke="url(#mugGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#subtleShadow)"/>
  <path d="M38 30.5C44 30.5 45.5 40.5 38 43.5" fill="none" stroke="#2C3E2E" stroke-width="1.8" stroke-linecap="round" opacity="0.25"/>

  <!-- Mug Main Body -->
  <g filter="url(#subtleShadow)">
    <path d="M18 26H46L43.5 47C43.2 49 41.5 50.5 39.5 50.5H24.5C22.5 50.5 20.8 49 20.5 47L18 26Z" fill="url(#mugGrad)"/>
    
    <!-- Mug Rim & Liquid Interior -->
    <ellipse cx="32" cy="26" rx="14" ry="4" fill="url(#mugGrad)"/>
    <ellipse cx="32" cy="26" rx="12.5" ry="3.2" fill="url(#coffeeCrema)"/>

    <!-- Latte Art Heart on Top -->
    <path d="M32 27.5C30.5 25.8 28.5 25.5 28.5 24.2C28.5 23.2 29.5 22.5 30.5 23C31.5 23.5 32 24.5 32 24.5C32 24.5 32.5 23.5 33.5 23C34.5 22.5 35.5 23.2 35.5 24.2C35.5 25.5 33.5 25.8 32 27.5Z" fill="#FFF7ED" opacity="0.95"/>
    <circle cx="32" cy="27.8" r="0.5" fill="#D07A60"/>

    <!-- Mug Body Heart / Leaf Logo Stamp -->
    <path d="M32 40C30 37.5 27 37 27 35C27 33.5 28.5 32.5 30 33.2C31.2 33.8 32 35 32 35C32 35 32.8 33.8 34 33.2C35.5 32.5 37 33.5 37 35C37 37 34 37.5 32 40Z" fill="url(#goldAccent)"/>
  </g>

  <!-- Sparkle & Glow Accents -->
  <path d="M48 15L49 17.5L51.5 18.5L49 19.5L48 22L47 19.5L44.5 18.5L47 17.5Z" fill="#D07A60"/>
  <circle cx="15" cy="18" r="1.2" fill="#8EA696"/>
</svg>
